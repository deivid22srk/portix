name: Admin panel

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - ".github/workflows/admin-panel.yml"
  workflow_dispatch:

concurrency:
  group: portix-admin-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publicar painel (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar ./admin
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
