name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portix-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded

      - name: Gerar scaffold Android
        run: |
          flutter create \
            --platforms=android \
            --org com.deivid22srk \
            --project-name portix \
            /tmp/portix_scaffold
          cp -R /tmp/portix_scaffold/android ./android

      - name: Ajustar Android para release
        run: python3 tools/ci/prepare_android.py

      - name: Ícone e splash nativos
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK release (split por ABI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Listar artefatos
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: portix-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
