name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portix-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feed-sql:
    name: Feed algorithm (Postgres real)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cliente PostgreSQL
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Migrations + assertivas + simulação + EXPLAIN
        run: bash tools/feed/run_sql_tests.sh

  build:
    name: Analyze, test and build release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # História completa para os portões de UI (regra ui_change em HEAD~1).
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: DEBUG formato (temporário)
        run: |
          for f in lib/data/supabase_catalog_repository.dart \
                   lib/features/home/feed_impressions.dart \
                   lib/models/home_feed.dart \
                   test/home_feed_page_test.dart; do
            echo "### $f"
            dart format --output=show "$f" > /tmp/fmt.dart
            diff -u "$f" /tmp/fmt.dart || true
          done

      - name: Portões de UI
        run: tool/ui_gates.sh --skip-analyze

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded

      - name: Gerar scaffold Android
        run: |
          flutter create \
            --platforms=android \
            --org com.deivid22srk \
            --project-name portix \
            /tmp/portix_scaffold
          cp -R /tmp/portix_scaffold/android ./android

      - name: Ajustar Android para release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/ci/prepare_android.py

      - name: Ícone e splash nativos
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Rust + targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Resolver NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$(ls -d "$SDK/ndk/"* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$SDKMANAGER" --install "ndk;26.1.10909125" >/dev/null
            NDK_DIR="$SDK/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"

      - name: Compilar motor de download (Rust)
        run: |
          cd native/portix_downloader
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../../android/app/src/main/jniLibs build --release
          find ../../android/app/src/main/jniLibs -name "*.so" -print

      - name: Build APK release (split por ABI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Listar artefatos
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Publicar APKs
        uses: actions/upload-artifact@v5
        with:
          name: portix-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APKs na landing (releases)
        # Somente a main publica em produção (landing). Branches de trabalho
        # validam analyze/test/build sem efeito colateral externo.
        if: github.ref == 'refs/heads/main'
        env:
          LANDING_TOKEN: ${{ secrets.LANDING_GH_TOKEN }}
        run: |
          set -e
          export GH_TOKEN="$LANDING_TOKEN"
          REPO="deivid22srk/portix-landing"
          if ! gh release view apk-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create apk-latest --repo "$REPO" \
              --title "PORTIX APK (latest)" \
              --notes "APKs mais recentes do PORTIX (build automático a partir de ${{ github.sha }})."
          fi
          gh release upload apk-latest build/app/outputs/flutter-apk/*.apk --repo "$REPO" --clobber

      - name: Publicar release versionada na landing
        # Somente a main publica em produção (landing). Branches de trabalho
        # validam analyze/test/build sem efeito colateral externo.
        if: github.ref == 'refs/heads/main'
        env:
          LANDING_TOKEN: ${{ secrets.LANDING_GH_TOKEN }}
        run: |
          set -e
          export GH_TOKEN="$LANDING_TOKEN"
          REPO="deivid22srk/portix-landing"
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [ -z "$VERSION" ]; then
            echo "não encontrei a versão no pubspec.yaml"
            exit 1
          fi
          NOTES="$(printf 'APKs assinados da versão %s (build automático a partir de %s).\n\nO app PORTIX é um catálogo de ports de terceiros e não hospeda jogos.\n\n- Termos de uso: https://deivid22srk.github.io/portix-landing/termos.html\n- Política de privacidade: https://deivid22srk.github.io/portix-landing/privacidade.html\n- Site e instruções de instalação: https://deivid22srk.github.io/portix-landing/' "$VERSION" "${{ github.sha }}")"
          if ! gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$REPO" \
              --title "PORTIX $VERSION" \
              --latest=false \
              --notes "$NOTES"
          fi
          # Reforça os APKs sempre que a versão já existir (rebuild da mesma versão).
          gh release upload "v$VERSION" build/app/outputs/flutter-apk/*.apk --repo "$REPO" --clobber
