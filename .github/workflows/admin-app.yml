name: Admin app

on:
  push:
    branches:
      - main
    paths:
      - "admin_app/**"
      - ".github/workflows/admin-app.yml"
  workflow_dispatch:

concurrency:
  group: portix-admin-app
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build do app PORTIX ADM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Dependências
        working-directory: admin_app
        run: flutter pub get

      - name: Análise estática
        working-directory: admin_app
        run: flutter analyze

      - name: Gerar scaffold Android
        run: |
          flutter create \
            --platforms=android \
            --org com.deivid22srk \
            --project-name portix_admin \
            /tmp/admin_scaffold
          cp -R /tmp/admin_scaffold/android ./admin_app/android

      - name: Ajustar Android
        run: python3 admin_app/tools/prepare_android.py

      - name: Build APK release
        working-directory: admin_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: portix-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
